services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: support_intelligence
      POSTGRES_USER: support_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_app -d support_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/support_intelligence
      SPRING_DATASOURCE_USERNAME: support_app
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
      APP_SECURITY_USERNAME: ${APP_SECURITY_USERNAME:-support}
      APP_SECURITY_PASSWORD: ${APP_SECURITY_PASSWORD:-change-me-demo}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  postgres_data:
